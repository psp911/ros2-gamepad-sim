x-ros-common: &ros-common
  image: ros2-lyrical-teleop:latest
  network_mode: host
  ipc: host                                  # общий IPC, чтобы Fast DDS не ломался между контейнерами
  restart: unless-stopped
  environment:
    - ROS_DOMAIN_ID=0
    - FASTDDS_BUILTIN_TRANSPORTS=UDPv4       # отключаем shared memory, передача только по UDP

services:
  joy:
    <<: *ros-common
    container_name: ros2_joy
    build:
      context: .
      dockerfile_inline: |
        FROM ros:lyrical-ros-base-resolute
        RUN apt-get update && apt-get install -y --no-install-recommends \
              ros-lyrical-joy \
              ros-lyrical-teleop-twist-joy \
            && rm -rf /var/lib/apt/lists/*
    volumes:
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - 'c 13:* rmw'
    command: ros2 run joy joy_node

  teleop:
    <<: *ros-common
    container_name: ros2_teleop
    depends_on:
      - joy
    command: >
      ros2 run teleop_twist_joy teleop_node --ros-args
      -p axis_linear.x:=1
      -p axis_angular.yaw:=2
      -p scale_linear.x:=1.5
      -p scale_angular.yaw:=2.0
      -p enable_button:=5
      -p enable_turbo_button:=7
      -p scale_linear_turbo.x:=4.0
      -p scale_angular_turbo.yaw:=3.0
